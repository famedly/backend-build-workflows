name: Rust

# Trigger the CI on any tags, pushes to any branch and PRs to any branch.
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["*"]

# Make sure there is no pipeline running uselessly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-a # -a should be removed, just for separate workflows in this repository
  cancel-in-progress: true

# Environment variables for all jobs.
env:
  CARGO_TERM_COLOR: always

# Defined CI jobs.
jobs:
  # test-rust-workflow:
  #   uses: ./.github/workflows/rust-workflow.yml
  #   with:
  #     ref: ${{ github.ref }}
  #   secrets: inherit
  test-publish:
    uses: ./.github/workflows/publish-crate.yml
    secrets:
      CRATE_REGISTRY_SSH_PRIVKEY: ${{ secrets.CI_SSH_PRIVATE_KEY }}
      CRATE_REGISTRY_AUTH_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    with:
      packages: "test_package"
